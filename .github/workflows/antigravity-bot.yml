name: Antigravity Interactive Issue Resolver

on:
  issue_comment:
    types: [created]

jobs:
  antigravity-bot:
    name: Antigravity Plan & Execute Bot
    # Trigger conditions:
    # 1. Comment must be on an Issue (not an existing PR)
    # 2. Comment must contain keyword '/plan', '/fix', '/antigravity', or '/approve'
    # 3. Comment author must be an authorized collaborator/member
    if: >-
      !github.event.issue.pull_request &&
      (startsWith(github.event.comment.body, '/plan') || startsWith(github.event.comment.body, '/fix') || startsWith(github.event.comment.body, '/antigravity') || startsWith(github.event.comment.body, '/approve')) &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: React to Comment (Acknowledge)
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ github.event.comment.id }}
          reactions: eyes

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Project Dependencies & Antigravity SDK
        run: |
          npm ci || npm install
          pip install google-antigravity

      - name: Configure Personal Gemini Pro Auth & Scoped Permissions
        env:
          CACHED_AUTH: ${{ secrets.ANTIGRAVITY_AUTH_JSON || secrets.ANTIGRAVITY_API_KEY }}
        run: |
          mkdir -p ~/.gemini/antigravity-cli ~/.antigravity ~/.config/antigravity
          
          if [ -n "$CACHED_AUTH" ]; then
            echo "Writing personal Gemini Pro credentials to config locations..."
            echo "$CACHED_AUTH" > ~/.gemini/oauth_creds.json
            echo "$CACHED_AUTH" > ~/.gemini/antigravity-cli/oauth_creds.json
            echo "$CACHED_AUTH" > ~/.gemini/antigravity-cli/auth.json
            echo "$CACHED_AUTH" > ~/.antigravity/oauth_creds.json
            echo "$CACHED_AUTH" > ~/.antigravity/auth.json
            echo "$CACHED_AUTH" > ~/.config/antigravity/oauth_creds.json
            echo "$CACHED_AUTH" > ~/.config/antigravity/auth.json
          else
            echo "⚠️ WARNING: ANTIGRAVITY_AUTH_JSON secret is empty!"
          fi

          echo "Configuring CI execution permissions in settings.json..."
          cat <<'EOF' > ~/.gemini/antigravity-cli/settings.json
          {
            "permissions": {
              "allow": [
                "*",
                "command(*)",
                "read_file(*)",
                "write_file(*)",
                "edit_file(*)",
                "create_file(*)",
                "delete_file(*)",
                "mcp(*)"
              ]
            }
          }
          EOF
          cp ~/.gemini/antigravity-cli/settings.json ~/.antigravity/settings.json
          cp ~/.gemini/antigravity-cli/settings.json ~/.gemini/settings.json
          
          find ~/.gemini ~/.antigravity ~/.config/antigravity -type d -exec chmod 755 {} + 2>/dev/null || true
          find ~/.gemini ~/.antigravity ~/.config/antigravity -type f -exec chmod 600 {} + 2>/dev/null || true

      # -----------------------------------------------------------------
      # PHASE 1: PLANNING MODE (/plan or /fix)
      # -----------------------------------------------------------------
      - name: Generate Implementation Plan (via Personal Gemini Pro)
        if: "!startsWith(github.event.comment.body, '/approve')"
        env:
          ISSUE_NUM: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          PYTHONUNBUFFERED: '1'
        run: |
          export AGY_PROMPT="Analyze GitHub Issue #${ISSUE_NUM}: ${ISSUE_TITLE}

          Issue Details:
          ${ISSUE_BODY}

          User Request from @${COMMENT_AUTHOR}:
          ${COMMENT_BODY}

          Formulate a detailed implementation plan describing:
          1. Root cause analysis.
          2. Target files to modify or create.
          3. Proposed changes step-by-step."

          python3 -c '
          import asyncio, os, sys
          from google.antigravity import Agent, LocalAgentConfig

          async def main():
              prompt = os.environ.get("AGY_PROMPT", "")
              print("🚀 Initializing Antigravity SDK Agent via Personal Gemini Pro (Read-Only Planning)...", flush=True)
              config = LocalAgentConfig(
                  vertex=False,
                  system_instructions="Formulate a detailed implementation plan only. Do not make edits."
              )
              async with Agent(config) as agent:
                  response = await agent.chat(prompt)
                  with open("proposed_plan.txt", "w") as plan_file:
                      async for token in response:
                          sys.stdout.write(token)
                          sys.stdout.flush()
                          plan_file.write(token)
              print("\n✅ Plan generation complete.", flush=True)

          asyncio.run(main())
          '

      - name: Post Proposed Plan to Issue Comment
        if: "!startsWith(github.event.comment.body, '/approve')"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          PLAN_CONTENT=$(cat proposed_plan.txt | sed 's/\x1b\[[0-9;]*m//g' || echo "Plan generated.")
          
          COMMENT_BODY=$(cat <<EOF
          🤖 **Antigravity Proposed Implementation Plan**

          ${PLAN_CONTENT}

          ---
          ✋ *To approve and execute this plan, reply to this issue with **\`/approve\`**.*
          EOF
          )
          
          gh issue comment "$ISSUE_NUM" --body "$COMMENT_BODY"

      # -----------------------------------------------------------------
      # PHASE 2: EXECUTION MODE (/approve)
      # -----------------------------------------------------------------
      - name: Fetch Latest Approved Plan from Issue History
        if: "startsWith(github.event.comment.body, '/approve')"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          # Fetch previous comments on this issue and extract the last Antigravity plan
          LATEST_PLAN=$(gh api "repos/${{ github.repository }}/issues/${ISSUE_NUM}/comments" --jq '[.[] | select(.body | contains("Antigravity Proposed Implementation Plan"))] | last | .body' || echo "")
          echo "APPROVED_PLAN<<EOF" >> $GITHUB_ENV
          echo "$LATEST_PLAN" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Configure Git & Create Branch
        if: "startsWith(github.event.comment.body, '/approve')"
        id: branch
        run: |
          BRANCH_NAME="antigravity/issue-${{ github.event.issue.number }}-${{ github.run_id }}"
          git config user.name "antigravity-bot[bot]"
          git config user.email "antigravity-bot[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"
          echo "name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Execute Approved Plan (via Personal Gemini Pro)
        if: "startsWith(github.event.comment.body, '/approve')"
        env:
          ISSUE_NUM: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          PYTHONUNBUFFERED: '1'
        run: |
          export AGY_PROMPT="Execute the approved plan for GitHub Issue #${ISSUE_NUM}: ${ISSUE_TITLE}

          Original Issue:
          ${ISSUE_BODY}

          Approved Implementation Plan:
          ${APPROVED_PLAN}

          Implement all changes and ensure project quality standards are met."

          python3 -c '
          import asyncio, os, sys
          from google.antigravity import Agent, LocalAgentConfig, CapabilitiesConfig

          async def main():
              prompt = os.environ.get("AGY_PROMPT", "")
              print("🚀 Initializing Antigravity SDK Agent via Personal Gemini Pro (Write Execution)...", flush=True)
              config = LocalAgentConfig(
                  vertex=False,
                  capabilities=CapabilitiesConfig()
              )
              async with Agent(config) as agent:
                  response = await agent.chat(prompt)
                  async for token in response:
                      sys.stdout.write(token)
                      sys.stdout.flush()
              print("\n✅ Plan execution complete.", flush=True)

          asyncio.run(main())
          '

      - name: Run Tests & Verification
        if: "startsWith(github.event.comment.body, '/approve')"
        run: |
          if grep -q '"test":' package.json; then
            npm test
          else
            echo "No test script found, skipping tests."
          fi

      - name: Create Pull Request
        if: "startsWith(github.event.comment.body, '/approve')"
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.branch.outputs.branch_name }}
          title: "fix: resolution for Issue #${{ github.event.issue.number }} (${{ github.event.issue.title }})"
          body: |
            ## 🤖 Antigravity Automated Pull Request

            Resolves #${{ github.event.issue.number }}

            ### Execution Context
            - **Approved by:** @${{ github.event.comment.user.login }}
            
            ---
            *Generated automatically by Antigravity Python SDK. Please review and test before merging.*
          commit-message: "fix: automated resolution for issue #${{ github.event.issue.number }}"
          labels: |
            automated-pr
            antigravity

      - name: Post PR Confirmation Comment
        if: "startsWith(github.event.comment.body, '/approve') && success()"
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: "🚀 **Antigravity SDK** has executed the approved plan and opened a Pull Request for review."
          reactions: rocket
