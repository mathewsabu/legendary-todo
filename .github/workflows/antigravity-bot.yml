name: Antigravity Issue Resolver

on:
  issue_comment:
    types: [created]

jobs:
  antigravity-bot:
    name: Execute Antigravity CLI & Raise PR
    # Trigger conditions:
    # 1. Comment must be on an Issue (not an existing PR)
    # 2. Comment must contain keyword '/antigravity' or '/fix'
    # 3. Comment author must be an authorized repository collaborator/member or specific user
    if: >-
      !github.event.issue.pull_request &&
      (startsWith(github.event.comment.body, '/antigravity') || startsWith(github.event.comment.body, '/fix')) &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: React to Comment (Acknowledge)
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ github.event.comment.id }}
          reactions: eyes

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Project Dependencies
        run: |
          npm ci || npm install

      - name: Cache Antigravity CLI
        id: cache-antigravity
        uses: actions/cache@v4
        with:
          path: |
            ~/.antigravity
            ~/.local/bin
          key: ${{ runner.os }}-antigravity-cli-v1

      - name: Install Antigravity CLI
        if: steps.cache-antigravity.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash

      - name: Add Antigravity to PATH
        run: |
          echo "$HOME/.antigravity/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure Git & Create Branch
        id: branch
        run: |
          BRANCH_NAME="antigravity/issue-${{ github.event.issue.number }}-${{ github.run_id }}"
          git config user.name "antigravity-bot[bot]"
          git config user.email "antigravity-bot[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"
          echo "name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Invoke Antigravity CLI
        env:
          ANTIGRAVITY_API_KEY: ${{ secrets.ANTIGRAVITY_API_KEY }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          TERM: xterm-256color
          CI: 'true'
          PYTHONUNBUFFERED: '1'
        run: |
          export AGY_PROMPT="Resolve GitHub Issue #${ISSUE_NUM}: ${ISSUE_TITLE}

          Issue Description:
          ${ISSUE_BODY}

          User Instructions (from @${COMMENT_AUTHOR}):
          ${COMMENT_BODY}

          Tasks:
          1. Inspect the codebase and locate relevant files.
          2. Implement the required bug fixes or feature changes.
          3. Ensure all changes strictly maintain project quality standards."

          python3 -c '
          import os, pty, subprocess, sys, select
          prompt = os.environ.get("AGY_PROMPT", "")
          cmd = ["agy", "run", "--prompt", prompt, "--non-interactive"]
          print("🚀 Invoking Antigravity CLI...", flush=True)
          master, slave = pty.openpty()
          try:
              proc = subprocess.Popen(cmd, stdin=slave, stdout=slave, stderr=slave, close_fds=True)
              os.close(slave)
              while True:
                  r, _, _ = select.select([master], [], [], 0.1)
                  if master in r:
                      try:
                          data = os.read(master, 1024)
                          if not data:
                              break
                          sys.stdout.buffer.write(data)
                          sys.stdout.buffer.flush()
                      except OSError:
                          break
                  if proc.poll() is not None:
                      # Drain remaining bytes
                      while True:
                          r, _, _ = select.select([master], [], [], 0.05)
                          if master in r:
                              try:
                                  data = os.read(master, 1024)
                                  if not data:
                                      break
                                  sys.stdout.buffer.write(data)
                                  sys.stdout.buffer.flush()
                              except OSError:
                                  break
                          else:
                              break
                      break
              proc.wait()
              sys.exit(proc.returncode)
          except Exception as e:
              print(f"CLI Execution Error: {e}", flush=True)
              sys.exit(1)
          '

      - name: Run Tests & Verification
        run: |
          if grep -q '"test":' package.json; then
            npm test
          else
            echo "No test script found, skipping tests."
          fi

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.branch.outputs.branch_name }}
          title: "fix: resolution for Issue #${{ github.event.issue.number }} (${{ github.event.issue.title }})"
          body: |
            ## 🤖 Antigravity Automated Pull Request

            Resolves #${{ github.event.issue.number }}

            ### Trigger Context
            - **Triggered by:** @${{ github.event.comment.user.login }}
            - **Instruction:**
            > ${{ github.event.comment.body }}

            ---
            *Generated automatically by Antigravity CLI (`agy`). Please review and test before merging.*
          commit-message: "fix: automated resolution for issue #${{ github.event.issue.number }}"
          labels: |
            automated-pr
            antigravity
          draft: false

      - name: Confirm Execution in Issue Comment
        if: success()
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: "✅ **Antigravity CLI** has finished implementing the changes and created a new Pull Request for review."
          reactions: rocket
